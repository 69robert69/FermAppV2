services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fermapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fermapp}
      POSTGRES_DB: fermapp
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fermapp']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data

  # The API applies the database migrations (Flyway) when it starts.
  api:
    build:
      context: apps/api
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fermapp:${POSTGRES_PASSWORD:-fermapp}@postgres:5432/fermapp
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # MQTT broker for sensors: docker compose --profile iot up
  mosquitto:
    profiles: ['iot']
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres-data:
  redis-data:
